services:
  - type: web
    name: arena-pure-catalog
    runtime: python
    plan: free
    buildCommand: npm ci && npm run build:management && cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: cd backend && python manage.py migrate --noinput && gunicorn arena.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz/
    envVars:
      - key: NODE_VERSION
        value: "24.14.0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
